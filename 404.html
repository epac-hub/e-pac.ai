<style>
/* One screen, nothing scrolls: film behind, the name in front, one line under it. */
:root {
  --ink: #000;
  --paper: #fff;
  --mist: #9a9a9a;
  --accent: #fff;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--ink); color: var(--paper);
  font-family: "Geist", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.film, .shade { position: fixed; inset: 0; width: 100%; height: 100%; }
.film { object-fit: cover; filter: grayscale(1) contrast(1.15) brightness(.85); transform: scale(1.06); animation: drift 24s ease-out forwards; }
.shade {
  background:
    radial-gradient(ellipse at center, rgba(0,0,0,.15) 0%, rgba(0,0,0,.78) 75%),
    linear-gradient(to top, rgba(0,0,0,.88), transparent 45%);
}
main {
  position: relative; height: 100%; display: grid; place-items: center;
  text-align: center; padding: 0 16px;
}
h1 {
  margin: 0; font-family: "Instrument Serif", Georgia, serif; font-weight: 400;
  font-size: clamp(5.5rem, 26vw, 17rem); line-height: .9; letter-spacing: -.02em;
  opacity: 0; animation: rise 1.8s cubic-bezier(.2,.7,.2,1) .3s forwards;
}
h1 span, p i { color: var(--accent); }
p i { font-style: normal; }
p b { font-weight: 400; white-space: nowrap; }
p {
  margin: 1.4rem 0 0; color: var(--mist); font-size: clamp(.8rem, 2.6vw, 1rem);
  letter-spacing: .32em; text-transform: uppercase;
  opacity: 0; animation: rise 1.6s cubic-bezier(.2,.7,.2,1) 1.1s forwards;
}
@media (max-width: 520px) { p { line-height: 2; } p b { display: block; } p i { display: none; } }
footer {
  position: fixed; left: 0; right: 0; bottom: max(20px, env(safe-area-inset-bottom));
  text-align: center; color: var(--mist); font-size: .75rem; letter-spacing: .12em; opacity: .7;
}
@keyframes rise { from { opacity: 0; transform: translateY(24px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes drift { to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .film, h1, p { animation: none; opacity: 1; transform: none; }
}
</style>
</head>
<body>
<video class="film" src="/manus-storage/seedance-web_15a96ec9.mp4" poster="/manus-storage/hero-poster_c4087cb3.jpg" autoplay muted loop playsinline aria-hidden="true"></video>
<div class="shade"></div>
<main>
  <div>
    <h1>ePAC<span>.</span></h1>
    <p><b>Healthcare</b> <i>·</i> <b>Policy</b> <i>·</i> <b>Government Affairs</b></p>
  </div>
</main>
<footer>© ePAC, LLC · Puerto Rico</footer>
<script>
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelector('.film').pause();
</script>
</body>
